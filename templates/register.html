<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeleninur – registrace</title><link rel="stylesheet" href="{{url_for('static',filename='style.css',v='avatars-woodrim-v35')}}"></head><body class="login-bg"><main class="login-card"><img class="login-logo" src="{{url_for('static',filename='zeleninur-logo.png')}}" alt="Zeleninur"><h1>Vytvořit hráčský účet</h1><p class="muted">Kapacita hry je 200 hráčů. Po registraci se můžeš ihned pustit do hry.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><label>Uživatelské jméno</label><input name="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_-]+" autocomplete="username" required><label>Jméno, které uvidí ostatní</label><input name="display_name" minlength="2" maxlength="50" autocomplete="nickname" required><label>Heslo (alespoň 6 znaků)</label><input name="password" type="password" minlength="6" autocomplete="new-password" required><label>Heslo znovu</label><input name="confirm_password" type="password" minlength="6" autocomplete="new-password" required><button>Vytvořit účet a vstoupit do hry</button></form><p class="register-link"><a href="{{url_for('login')}}">Už účet mám – přihlásit se</a></p></main></body></html>
