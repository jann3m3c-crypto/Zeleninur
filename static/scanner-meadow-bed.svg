 <path d="M32 142 Q69 172 111 174 Q175 190 240 174 Q286 164 327 149" fill="none" stroke="#52351f" stroke-width="17" stroke-linecap="round"/>
 <path d="M32 137 Q69 167 111 169 Q175 185 240 169 Q286 159 327 144" fill="none" stroke="url(#wood)" stroke-width="15" stroke-linecap="round"/>
 <path d="M33 135 Q70 163 112 165 Q175 181 240 165 Q286 155 325 142" fill="none" stroke="#e4bd7b" stroke-opacity=".8" stroke-width="2.5" stroke-linecap="round"/>
 <path d="M39 143 Q70 169 111 171 M256 167 Q294 158 319 146" fill="none" stroke="url(#grain)" stroke-width="9" stroke-linecap="round"/>
