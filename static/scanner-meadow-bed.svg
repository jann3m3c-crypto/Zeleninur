 <path d="M28 152 Q48 120 89 114 Q133 94 178 108 Q231 100 270 118 Q308 128 330 158 Q321 184 284 196 Q240 216 182 212 Q115 219 70 196 Q34 181 28 152Z" fill="#31532e" opacity=".45" transform="translate(0 8)"/>
