   <path d="M0 145 L-34 134 M4 142 L38 119" stroke="#d8f09a" stroke-width="2.5" fill="none"/>
  </g>
 </g>
 <!-- Wild clover along the soil edge -->
 <g fill="url(#moss)" stroke="#426c2e" stroke-width="2"><path d="M49 163 Q37 143 49 141 Q60 144 56 162Z"/><path d="M56 164 Q65 145 74 153 Q73 164 56 164Z"/><path d="M296 171 Q281 152 294 149 Q305 154 302 170Z"/><path d="M301 173 Q315 154 323 163 Q319 174 301 173Z"/></g>
 <!-- tiny wildflowers, natural meadow context -->
 <g stroke="#6d713a" stroke-width="1.5"><path d="M54 165 l-3 -9 M304 176 l2 -10" stroke-width="2.5" fill="none"/></g>
 <g fill="#fff1d3" stroke="#d4be83" stroke-width="1.2"><circle cx="48" cy="155" r="3.7"/><circle cx="54" cy="151" r="3.7"/><circle cx="59" cy="155" r="3.7"/><circle cx="54" cy="160" r="3.7"/><circle cx="51" cy="155" r="2.2" fill="#e6b94f"/><circle cx="296" cy="162" r="3.5"/><circle cx="302" cy="158" r="3.5"/><circle cx="307" cy="162" r="3.5"/><circle cx="302" cy="167" r="3.5"/><circle cx="299" cy="162" r="2.1" fill="#e6b94f"/></g>
 <!-- a few grassy leaves to blend into a meadow -->
 <g fill="url(#moss)" stroke="#476d32" stroke-width="2.3"><path d="M66 171 Q44 144 52 138 Q71 151 69 170Z"/><path d="M75 178 Q72 148 82 145 Q90 167 75 178Z"/><path d="M288 180 Q290 152 302 150 Q305 173 288 180Z"/><path d="M279 174 Q261 151 269 145 Q286 157 279 174Z"/></g>
</g>
</svg>