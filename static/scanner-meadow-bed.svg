<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-label="Malý záhon s několika sazenicemi na louce">
<defs>
 <linearGradient id="soil" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#8f633a"/><stop offset=".28" stop-color="#654126"/><stop offset=".72" stop-color="#4b2e1d"/><stop offset="1" stop-color="#332014"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#d5a363"/><stop offset=".28" stop-color="#ac7843"/><stop offset=".7" stop-color="#80502e"/><stop offset="1" stop-color="#5e3922"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#d8ee86"/><stop offset=".36" stop-color="#9ecb53"/><stop offset=".7" stop-color="#64a142"/><stop offset="1" stop-color="#3d7836"/></linearGradient>
 <linearGradient id="leafB" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#bade6d"/><stop offset=".52" stop-color="#7cb54a"/><stop offset="1" stop-color="#3a7334"/></linearGradient>
 <linearGradient id="moss" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7d66a"/><stop offset=".5" stop-color="#6e9f43"/><stop offset="1" stop-color="#426f32"/></linearGradient>
 <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#2f2819" flood-opacity=".42"/></filter>
 <pattern id="grain" width="65" height="17" patternUnits="userSpaceOnUse"><path d="M-3 6 Q15 1 34 7 T70 5 M8 14 Q23 10 40 14" fill="none" stroke="#40291a" stroke-opacity=".42" stroke-width="1.6"/></pattern>
 <pattern id="earth" width="44" height="34" patternUnits="userSpaceOnUse"><g fill="#c18b51" opacity=".7"><ellipse cx="9" cy="11" rx="2.7" ry="1.8"/><circle cx="35" cy="24" r="1.6"/></g><g fill="#24180f" opacity=".45"><circle cx="22" cy="29" r="2"/><ellipse cx="32" cy="7" rx="3" ry="1.5"/></g></pattern>
</defs>
<g filter="url(#shadow)">
