 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#b67b3f"/><stop offset=".45" stop-color="#895429"/><stop offset="1" stop-color="#57361f"/></linearGradient>
 <linearGradient id="woodLite" x2="0" y2="1"><stop stop-color="#d9ad67"/><stop offset="1" stop-color="#98602e"/></linearGradient>
 <linearGradient id="sand" x2="0" y2="1"><stop stop-color="#e3c78a"/><stop offset="1" stop-color="#b28b4e"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#6f725d"/><stop offset="1" stop-color="#343e30"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#fff2a6" stop-opacity=".8"/><stop offset="1" stop-color="#f2b751" stop-opacity="0"/></radialGradient>
 <pattern id="grain" width="76" height="22" patternUnits="userSpaceOnUse"><path d="M3 8 Q20 3 43 9 T76 8 M14 18 Q27 14 39 18 T60 17" fill="none" stroke="#4b2d19" stroke-opacity=".24" stroke-width="2"/></pattern>
