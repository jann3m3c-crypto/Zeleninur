<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Zeleninur – sklepní třídírna úrody</title>
<desc id="desc">Malovaný sklep s kamennými stěnami, dřevěnými policemi, kořenovou zeleninou, bednou s pískem, ovocem a oddělenou bednou na brambory.</desc>
<defs>
